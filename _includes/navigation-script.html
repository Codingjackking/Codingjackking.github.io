<script>
  anchors.add();

  // Mobile menu toggle
  const menuToggle = document.querySelector(".mobile-menu-toggle");
  const navMenu = document.querySelector(".nav-menu");

  if (menuToggle && navMenu) {
    menuToggle.addEventListener("click", function () {
      this.classList.toggle("active");
      navMenu.classList.toggle("active");
      const isExpanded = this.classList.contains("active");
      this.setAttribute("aria-expanded", isExpanded);
    });
  }

  // Dropdown menu functionality
  const dropdownToggles = document.querySelectorAll(".has-dropdown > .nav-link");

  dropdownToggles.forEach((toggle) => {
    toggle.addEventListener("click", function (e) {
      if (window.innerWidth <= 768) {
        e.preventDefault();
        const parent = this.parentElement;
        const isExpanded = parent.classList.contains("active");

        // Close all other dropdowns
        document.querySelectorAll(".has-dropdown").forEach((item) => {
          if (item !== parent) {
            item.classList.remove("active");
            item.querySelector(".nav-link").setAttribute("aria-expanded", "false");
          }
        });

        // Toggle current dropdown
        parent.classList.toggle("active");
        this.setAttribute("aria-expanded", !isExpanded);
      }
    });

    // Desktop hover
    const parent = toggle.parentElement;
    parent.addEventListener("mouseenter", function () {
      if (window.innerWidth > 768) {
        this.classList.add("active");
        toggle.setAttribute("aria-expanded", "true");
      }
    });

    parent.addEventListener("mouseleave", function () {
      if (window.innerWidth > 768) {
        this.classList.remove("active");
        toggle.setAttribute("aria-expanded", "false");
      }
    });
  });

  // Add scroll-based header shadow
  const header = document.querySelector(".site-header");
  if (header) {
    window.addEventListener("scroll", () => {
      if (window.scrollY > 10) {
        header.classList.add("scrolled");
      } else {
        header.classList.remove("scrolled");
      }
    });
  }

  // Highlight active page in navigation
  const currentPath = window.location.pathname;
  const navLinks = document.querySelectorAll('.nav-link, .dropdown-menu a');
  
  navLinks.forEach(link => {
    const linkPath = new URL(link.href).pathname;
    if (currentPath === linkPath || (currentPath !== '/' && linkPath !== '/' && currentPath.startsWith(linkPath))) {
      link.classList.add('active');
      // Also mark parent dropdown as active if this is a dropdown item
      const dropdown = link.closest('.has-dropdown');
      if (dropdown) {
        dropdown.querySelector('.nav-link').classList.add('active');
      }
    }
  });
</script>
